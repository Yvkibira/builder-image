name: Publish image

# Builds the build image and pushes it to GitHub Container Registry. Rebuilds
# weekly so base packages and browser binaries stay current, and on every push.
on:
    schedule:
        - cron: '0 3 * * 1' # Mondays 03:00 UTC
    workflow_dispatch:
    push:
        branches: [main]

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/builder-image:latest
                      ghcr.io/${{ github.repository_owner }}/builder-image:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
